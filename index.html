<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamy Music Store</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');

    :root {
      --cream: #f6ead9;
      --soft-cream: #ead7bd;
      --brown: #6a4d3d;
      --deep-brown: #4e372d;
      --wood: #a77b58;
      --wood-dark: #7b563d;
      --gold: #d9b77c;
      --leaf: #6d8a63;
      --leaf-dark: #4f6d49;
      --shadow: rgba(35, 21, 15, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--cream);
      overflow: hidden;
      background: #b9987d;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(255,240,214,0.35), transparent 35%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.06)),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 2px,
          rgba(0,0,0,0.02) 2px,
          rgba(0,0,0,0.02) 4px
        ),
        linear-gradient(135deg, #caa98d, #b18e75 42%, #9b7b66 100%);
    }

    /* subtle wall texture */
    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 18%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.05), transparent 14%),
        radial-gradient(circle at 30% 75%, rgba(0,0,0,0.05), transparent 18%),
        radial-gradient(circle at 70% 85%, rgba(0,0,0,0.06), transparent 14%);
      pointer-events: none;
      opacity: 0.9;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .heading {
      text-align: center;
      transition: opacity 0.6s ease;
    }

    .heading h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(58px, 7vw, 94px);
      font-weight: 500;
      line-height: 0.95;
      color: #f9efe3;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 18px rgba(55, 36, 26, 0.18);
    }

    .heading p {
      margin: 10px 0 0;
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 243, 227, 0.82);
    }

    .shop-area {
      position: relative;
      width: min(420px, 86vw);
      height: min(610px, 68vh);
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    /* ivy */
    .ivy {
      position: absolute;
      width: 150px;
      height: 520px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.9;
    }

    .ivy.left {
      left: -70px;
      top: -16px;
      transform: rotate(-6deg);
    }

    .ivy.right {
      right: -70px;
      top: 5px;
      transform: scaleX(-1) rotate(-12deg);
    }

    .vine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #57714f, #79906f 55%, #57714f);
      border-radius: 20px;
      opacity: 0.7;
    }

    .leaf {
      position: absolute;
      width: 28px;
      height: 18px;
      background: linear-gradient(135deg, #88a47e, #58734f);
      border-radius: 100% 0 100% 0;
      box-shadow: inset -2px -2px 4px rgba(255,255,255,0.15);
    }

    /* left ivy leaves */
    .ivy.left .leaf:nth-child(2) { top: 35px; left: 55px; transform: rotate(15deg); }
    .ivy.left .leaf:nth-child(3) { top: 82px; left: 22px; transform: rotate(-28deg); }
    .ivy.left .leaf:nth-child(4) { top: 132px; left: 64px; transform: rotate(35deg); }
    .ivy.left .leaf:nth-child(5) { top: 182px; left: 20px; transform: rotate(-32deg); }
    .ivy.left .leaf:nth-child(6) { top: 242px; left: 65px; transform: rotate(21deg); }
    .ivy.left .leaf:nth-child(7) { top: 300px; left: 18px; transform: rotate(-18deg); }
    .ivy.left .leaf:nth-child(8) { top: 356px; left: 57px; transform: rotate(37deg); }
    .ivy.left .leaf:nth-child(9) { top: 418px; left: 18px; transform: rotate(-22deg); }
    .ivy.left .leaf:nth-child(10){ top: 474px; left: 58px; transform: rotate(22deg); }

    /* right ivy leaves */
    .ivy.right .leaf:nth-child(2) { top: 38px; left: 50px; transform: rotate(18deg); }
    .ivy.right .leaf:nth-child(3) { top: 98px; left: 20px; transform: rotate(-24deg); }
    .ivy.right .leaf:nth-child(4) { top: 150px; left: 62px; transform: rotate(30deg); }
    .ivy.right .leaf:nth-child(5) { top: 208px; left: 18px; transform: rotate(-38deg); }
    .ivy.right .leaf:nth-child(6) { top: 258px; left: 61px; transform: rotate(18deg); }
    .ivy.right .leaf:nth-child(7) { top: 319px; left: 19px; transform: rotate(-15deg); }
    .ivy.right .leaf:nth-child(8) { top: 378px; left: 62px; transform: rotate(33deg); }
    .ivy.right .leaf:nth-child(9) { top: 435px; left: 16px; transform: rotate(-22deg); }
    .ivy.right .leaf:nth-child(10){ top: 490px; left: 55px; transform: rotate(26deg); }

    .door-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 390px;
      border-radius: 220px 220px 0 0;
      padding: 14px;
      background: linear-gradient(180deg, #5d4033, #7b5641 70%, #5b4134);
      box-shadow:
        0 16px 40px rgba(39, 21, 13, 0.28),
        0 0 0 4px rgba(78, 55, 45, 0.55);
    }

    .door-arch {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 210px 210px 0 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 40%, rgba(0,0,0,0.08)),
        linear-gradient(180deg, #d4b08a, #b68d68 60%, #9e7657);
      overflow: hidden;
      box-shadow: inset 0 0 0 2px rgba(255, 235, 210, 0.14);
    }

    .door {
      position: absolute;
      inset: 16px;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      border: none;
      cursor: pointer;
      border-radius: 190px 190px 0 0;
      transform-origin: left center;
      transition: transform 1.9s cubic-bezier(.22,.7,.15,1);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0) 20%, rgba(0,0,0,0.08) 100%),
        repeating-linear-gradient(
          90deg,
          #b68661 0px,
          #b68661 16px,
          #ae7f5c 16px,
          #ae7f5c 32px
        );
      box-shadow:
        inset 8px 0 14px rgba(255,255,255,0.10),
        inset -12px 0 18px rgba(61,34,24,0.22),
        0 0 0 4px rgba(104, 72, 53, 0.55);
      z-index: 3;
    }

    .door:hover {
      filter: brightness(1.04);
    }

    .door-panel {
      position: absolute;
      inset: 20px;
      border-radius: 175px 175px 0 0;
      box-shadow:
        inset 0 0 0 2px rgba(238, 207, 167, 0.55),
        inset 0 0 0 12px rgba(118, 81, 57, 0.16);
    }

    .window {
      position: absolute;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      width: 58%;
      height: 29%;
      border-radius: 120px 120px 12px 12px;
      background:
        radial-gradient(circle at 50% 70%, #ffebc8, #efd0ac 40%, #d3ab8b 75%, #c09270 100%);
      border: 8px solid #79533b;
      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.35),
        0 0 14px rgba(255,222,180,0.18);
      display: grid;
      place-items: center;
    }

    .window span {
      font-size: 50px;
      color: #91644a;
      transform: translateY(4px);
    }

    .sign {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-2deg);
      width: 190px;
      background: #f2e2bc;
      color: #8a634b;
      border: 2px solid #d0b183;
      border-radius: 4px;
      padding: 18px 14px 14px;
      font-family: "Cormorant Garamond", serif;
      font-size: 25px;
      line-height: 1.15;
      box-shadow: 0 10px 18px rgba(66, 40, 27, 0.18);
    }

    .sign small {
      display: block;
      margin-top: 10px;
      font-family: "DM Sans", sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9a7356;
    }

    .handle {
      position: absolute;
      right: 28px;
      top: 63%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff3ba, #d5a95b 68%, #b58536);
      box-shadow:
        0 0 0 4px rgba(112, 75, 48, 0.55),
        0 4px 10px rgba(0,0,0,0.18);
    }

    .hint {
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      font-size: 19px;
      font-style: italic;
      letter-spacing: 0.8px;
      color: rgba(255, 242, 225, 0.92);
      animation: floatHint 2.8s ease-in-out infinite;
      transition: opacity 0.5s ease;
      text-shadow: 0 3px 10px rgba(70, 42, 28, 0.16);
    }

    .welcome {
      position: absolute;
      inset: 0;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.1s ease, visibility 1.1s ease;
      overflow: hidden;
    }

    .welcome-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(72, 49, 39, 0.35), rgba(72, 49, 39, 0.45)),
        radial-gradient(circle at 50% 20%, rgba(255, 229, 190, 0.25), transparent 30%),
        linear-gradient(180deg, #a88773 0%, #8f6d5d 100%);
    }

    /* blurred store interior */
    .store-interior {
      position: absolute;
      inset: 0;
      filter: blur(8px);
      transform: scale(1.03);
      opacity: 0.95;
    }

    .floor {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 26%;
      background:
        repeating-linear-gradient(
          90deg,
          #916b56 0px,
          #916b56 34px,
          #9f775e 34px,
          #9f775e 68px
        );
      box-shadow: inset 0 8px 20px rgba(0,0,0,0.12);
    }

    .shelf {
      position: absolute;
      top: 17%;
      width: 26%;
      height: 42%;
      background: linear-gradient(180deg, #6f4e3d, #5a4033);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .shelf.left { left: 9%; }
    .shelf.right { right: 9%; }

    .shelf::before,
    .shelf::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      height: 4px;
      background: rgba(242, 221, 193, 0.25);
    }

    .shelf::before { top: 34%; }
    .shelf::after { top: 68%; }

    .records {
      position: absolute;
      inset: 14px 10px;
    }

    .record {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #d3b284 0 7px, #2f2521 7px 18px, #171211 18px 26px);
      opacity: 0.9;
    }

    .record.r1 { top: 12%; left: 18%; }
    .record.r2 { top: 12%; right: 18%; }
    .record.r3 { top: 42%; left: 20%; }
    .record.r4 { top: 42%; right: 18%; }
    .record.r5 { top: 72%; left: 17%; }
    .record.r6 { top: 72%; right: 20%; }

    .counter {
      position: absolute;
      left: 50%;
      bottom: 18%;
      transform: translateX(-50%);
      width: 30%;
      height: 14%;
      background: linear-gradient(180deg, #87624d, #6e4f40);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .table {
      position: absolute;
      bottom: 18%;
      left: 29%;
      width: 12%;
      height: 9%;
      background: #7f5b49;
      border-radius: 50%;
      box-shadow: 0 8px 18px rgba(0,0,0,0.16);
    }

    .table::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 70%;
      transform: translateX(-50%);
      width: 10px;
      height: 52px;
      background: #6d4a3a;
      border-radius: 10px;
    }

    .chair {
      position: absolute;
      bottom: 18%;
      width: 7%;
      height: 12%;
      border: 5px solid #6e4d3b;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    .chair.left { left: 20%; }
    .chair.right { left: 40%; }

    .lamp {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 105px;
      background: #6a4a39;
    }

    .lamp::after {
      content: "";
      position: absolute;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 60px;
      border-radius: 0 0 55px 55px;
      background: radial-gradient(circle at 50% 0%, #edd3a2, #c59873 75%, #8a654f);
      box-shadow: 0 0 30px rgba(255, 227, 176, 0.15);
    }

    .welcome-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(63,42,34,0.22), rgba(63,42,34,0.40)),
        rgba(95, 67, 52, 0.12);
    }

    .welcome-card {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
    }

    .welcome-text {
      text-align: center;
      max-width: 760px;
      padding: 38px 32px;
      border-radius: 24px;
      background: rgba(100, 71, 55, 0.20);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(34, 20, 14, 0.12);
    }

    .welcome-text .icon {
      font-size: 38px;
      color: #ecd09a;
      margin-bottom: 14px;
    }

    .welcome-text h2 {
      margin: 0 0 18px;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(54px, 7vw, 88px);
      font-weight: 500;
      color: #fff3e6;
      line-height: 0.95;
    }

    .welcome-text p {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(24px, 2.5vw, 34px);
      line-height: 1.5;
      font-style: italic;
      color: #f4e2cc;
    }

    .little-note {
      margin-top: 30px;
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 241, 221, 0.8);
    }

    .scene.opening .door {
      transform: rotateY(-108deg);
      pointer-events: none;
    }

    .scene.opening .heading,
    .scene.opening .hint {
      opacity: 0;
    }

    .scene.entered .welcome {
      opacity: 1;
      visibility: visible;
    }

    @keyframes floatHint {
      0%, 100% { transform: translateY(0); opacity: 0.72; }
      50% { transform: translateY(-5px); opacity: 1; }
    }

    @media (max-width: 768px) {
      .shop-area {
        width: min(340px, 90vw);
        height: min(540px, 60vh);
      }

      .sign {
        width: 170px;
        font-size: 22px;
      }

      .heading h1 {
        font-size: clamp(46px, 12vw, 76px);
      }

      .heading p {
        font-size: 11px;
        letter-spacing: 4px;
      }

      .welcome-text {
        padding: 30px 20px;
      }

      .welcome-text p {
        font-size: clamp(22px, 4vw, 28px);
      }

      .ivy {
        opacity: 0.7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="content">
      <header class="heading">
        <h1>Dreamy Music Store</h1>
        <p>A little shop of melodies & memories</p>
      </header>

      <section class="shop-area">
        <div class="ivy left">
          <div class="vine"></div>
          <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
          <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
          <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
        </div>

        <div class="door-frame">
          <div class="door-arch">
            <button class="door" id="door" aria-label="Open the music store">
              <div class="door-panel"></div>
              <div class="window"><span>♫</span></div>
              <div class="sign">
                Dreamy<br>Music Store
                <small>Est. in a daydream</small>
              </div>
              <div class="handle"></div>
            </button>
          </div>
        </div>

        <div class="ivy right">
          <div class="vine"></div>
          <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
          <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
          <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
        </div>
      </section>

      <div class="hint">✧ Click the door to enter ✧</div>
    </div>

    <section class="welcome" id="welcome" aria-hidden="true">
      <div class="welcome-bg"></div>

      <div class="store-interior">
        <div class="lamp"></div>

        <div class="shelf left">
          <div class="records">
            <div class="record r1"></div>
            <div class="record r2"></div>
            <div class="record r3"></div>
            <div class="record r4"></div>
            <div class="record r5"></div>
            <div class="record r6"></div>
          </div>
        </div>

        <div class="shelf right">
          <div class="records">
            <div class="record r1"></div>
            <div class="record r2"></div>
            <div class="record r3"></div>
            <div class="record r4"></div>
            <div class="record r5"></div>
            <div class="record r6"></div>
          </div>
        </div>

        <div class="counter"></div>
        <div class="table"></div>
        <div class="chair left"></div>
        <div class="chair right"></div>
        <div class="floor"></div>
      </div>

      <div class="welcome-overlay"></div>

      <div class="welcome-card">
        <div class="welcome-text">
          <div class="icon">✧ ♫ ✧</div>
          <h2>Welcome, wanderer.</h2>
          <p>
            You've found Dreamy Music Store.<br>
            A little place where every melody<br>
            holds a memory.<br><br>
            Come in, your story is waiting.
          </p>
          <div class="little-note">Made of music & daydreams</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const door = document.getElementById("door");
    const welcome = document.getElementById("welcome");

    function playBell() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      try {
        const audio = new AudioContextClass();
        if (audio.state === "suspended") audio.resume();

        function chime(frequency, delay) {
          const start = audio.currentTime + delay;
          const notes = [
            { multiplier: 1, volume: 0.12 },
            { multiplier: 2.01, volume: 0.04 },
            { multiplier: 3.7, volume: 0.012 }
          ];

          notes.forEach(note => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();

            osc.type = "sine";
            osc.frequency.value = frequency * note.multiplier;

            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(note.volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 2);

            osc.connect(gain);
            gain.connect(audio.destination);

            osc.start(start);
            osc.stop(start + 2.1);
          });
        }

        chime(880, 0);
        chime(1174.66, 0.17);

        setTimeout(() => {
          audio.close();
        }, 2600);
      } catch (error) {
        console.log("Bell sound unavailable:", error);
      }
    }

    door.addEventListener("click", () => {
      if (scene.classList.contains("opening")) return;

      door.disabled = true;
      playBell();
      scene.classList.add("opening");

      setTimeout(() => {
        welcome.setAttribute("aria-hidden", "false");
        scene.classList.add("entered");
      }, 1650);
    });
  </script>
</body>
</html>
